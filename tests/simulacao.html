<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Simulação de partidas — Ilhas de Tinta</title>
  <style>
    body { font-family: monospace; padding: 16px; }
    iframe { width: 900px; height: 820px; border: 2px solid #ccc; }
    .passou { background: #eaffea; }
    .falhou { background: #ffeaea; }
  </style>
</head>
<body>
  <!--
    Roda várias partidas automáticas com CPUs dentro do jogo de verdade
    (num iframe) e confere: a partida termina, não há erros, e as CPUs Médio e
    Difícil nunca pisam no próprio rastro.

    Como usar: sirva a pasta do projeto (python3 -m http.server) e abra
    http://localhost:8000/tests/simulacao.html
    (Em file:// o navegador bloqueia o acesso ao iframe.)
    As partidas avançam pelo jogo.passo(dt) em lotes (bem mais rápido que o
    tempo real). Parâmetro opcional na URL: ?tempo=120 (segundos de jogo).
  -->
  <h1>Simulação de partidas com CPUs</h1>
  <pre id="saida">rodando…</pre>
  <iframe id="jogo" src="../index.html"></iframe>
  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var TEMPO = +(params.get('tempo') || 120);        // segundos de partida (tempo de jogo)
    var DT = 1 / 60;                                   // um quadro a 60 fps
    var saida = [], erros = [], falhas = 0;
    function log(t) { saida.push(t); document.getElementById('saida').textContent = saida.join('\n'); }

    function cpu(cor, dificuldade, nome) {
      return { tipo: 'cpu', cor: cor, dificuldade: dificuldade, nome: nome };
    }

    var CENARIOS = [
      { nome: '1 humano parado + CPU Fácil', vagas: [{ tipo: 'humano', cor: 'rosa', nome: 'Humano' }, cpu('azul', 'facil', 'CPU Fácil')] },
      { nome: '1 humano parado + CPU Médio', vagas: [{ tipo: 'humano', cor: 'rosa', nome: 'Humano' }, cpu('azul', 'medio', 'CPU Médio')] },
      { nome: '1 humano parado + CPU Difícil', vagas: [{ tipo: 'humano', cor: 'rosa', nome: 'Humano' }, cpu('azul', 'dificil', 'CPU Difícil')] },
      { nome: '3 CPUs (Fácil, Médio, Difícil)', vagas: [cpu('rosa', 'facil', 'Fácil'), cpu('azul', 'medio', 'Médio'), cpu('amarelo', 'dificil', 'Difícil')] },
      { nome: '4 CPUs (Fácil, Médio, Difícil, Difícil)', vagas: [cpu('rosa', 'facil', 'Fácil'), cpu('azul', 'medio', 'Médio'), cpu('amarelo', 'dificil', 'Difícil A'), cpu('roxo', 'dificil', 'Difícil B')] },
      { nome: '4 CPUs Médio', vagas: [cpu('rosa', 'medio', 'M1'), cpu('azul', 'medio', 'M2'), cpu('amarelo', 'medio', 'M3'), cpu('roxo', 'medio', 'M4')] },
      { nome: '1 CPU Desafio + 3 CPUs (Desafio contra CPUs)', vagas: [cpu('rosa', 'desafio', 'Desafio'), cpu('azul', 'medio', 'Médio'), cpu('amarelo', 'dificil', 'Difícil'), cpu('roxo', 'facil', 'Fácil')] }
    ];

    // "Humano robô": uma pessoa de mentira (tipo humano, velocidade de gente)
    // controlada por um cérebro de CPU, para medir o Desafio contra "pessoas".
    //   cuidadoso = cérebro Médio (volta quando alguém chega perto)
    //   descuidado = cérebro Fácil (voltas pequenas, vira ao acaso às vezes)
    //   esperto    = voltas curtas e volta para casa quando alguém chega perto
    //                (o que uma criança aprende a fazer contra o Desafio 😈)
    function robo(cor, perfil, nome) { return { tipo: 'humano', cor: cor, nome: nome, robo: perfil }; }
    var REPETICOES = +(params.get('repeticoes') || 4);
    [['dificil', 'Difícil'], ['desafio', 'Desafio']].forEach(function (nivel) {
      [['medio', 'cuidadoso'], ['facil', 'descuidado'], ['esperto', 'esperto']].forEach(function (perfil) {
        for (var r = 0; r < REPETICOES; r++) {
          CENARIOS.push({
            nome: 'robô ' + perfil[1] + ' x CPU ' + nivel[1] + ' #' + (r + 1),
            grupo: 'robô ' + perfil[1] + ' x CPU ' + nivel[1],
            vagas: [robo('rosa', perfil[0], 'Robô'), cpu('azul', nivel[0], 'CPU ' + nivel[1])]
          });
        }
      });
    });
    var resumo = {}; // grupo → { partidas, vitoriasRobo, cortesNoRobo, cortesDoRobo, pctRobo, pctCpu }

    var frame = document.getElementById('jogo');
    frame.addEventListener('load', function () {
      var w = frame.contentWindow;
      w.addEventListener('error', function (e) { erros.push(e.message); });
      var IT = w.IlhasDeTinta;
      IT.ia.NIVEIS.esperto = {
        profundidade: [2, 3], lado: [2, 4], candidatos: 4, acaso: 0, seguro: true,
        rastroMax: 8, medo: 6, caca: 0
      };
      IT.config.TEMPO_LIMITE = TEMPO;
      var i = 0;

      // ---- Controles: cada esquema de teclado move o jogador certo ----
      function tecla(code) {
        w.dispatchEvent(new w.KeyboardEvent('keydown', { code: code, bubbles: true }));
      }
      function testarControles() {
        var humano = function (cor, nome) { return { tipo: 'humano', cor: cor, nome: nome }; };
        IT.jogo.jogar({ vagas: [humano('rosa', 'J1'), humano('azul', 'J2'), humano('amarelo', 'J3'), humano('roxo', 'J4')] });
        var js = IT.jogo.jogadores;
        var casos = [
          ['KeyW', 0, 'cima'], ['ArrowLeft', 1, 'esquerda'], ['KeyK', 2, 'baixo'],
          ['Numpad6', 3, 'direita'], ['KeyT', 3, 'cima']
        ];
        casos.forEach(function (c) {
          js.forEach(function (j) { j.explorador.proximaDirecao = null; });
          tecla(c[0]);
          var ok = js.every(function (j, k) { return j.explorador.proximaDirecao === (k === c[1] ? c[2] : null); });
          if (!ok) falhas++;
          log((ok ? 'ok   - ' : 'FALHA - ') + 'tecla ' + c[0] + ' move só o J' + (c[1] + 1));
        });
        // Um único humano (na vaga 2) aceita WASD e setas; CPUs não obedecem ao teclado.
        IT.jogo.jogar({ vagas: [cpu('rosa', 'medio', 'C1'), humano('azul', 'Solo')] });
        js = IT.jogo.jogadores;
        js[1].explorador.proximaDirecao = null;
        tecla('KeyA');
        var ok1 = js[1].explorador.proximaDirecao === 'esquerda';
        js[1].explorador.proximaDirecao = null;
        tecla('ArrowUp');
        var ok2 = js[1].explorador.proximaDirecao === 'cima';
        if (!(ok1 && ok2)) falhas++;
        log((ok1 && ok2 ? 'ok   - ' : 'FALHA - ') + 'um único humano aceita WASD e setas');
      }
      testarControles();

      function proximo() {
        if (i >= CENARIOS.length) return terminar();
        var c = CENARIOS[i++];
        IT.jogo.jogar({ vagas: c.vagas });
        IT.jogo.jogadores.forEach(function (j, i) {
          var perfil = c.vagas[i].robo;
          if (!perfil) return;
          j.dificuldade = perfil;
          j.ia = IT.ia.criar(j, IT.jogo);
          j.explorador.controlador = j.ia; // continua "humano" e na velocidade de gente
        });
        var quadros = 0, limite = (TEMPO + 5) / DT;
        // Avança 600 quadros (10 s de jogo) por vez até a partida acabar.
        var t = setInterval(function () {
          for (var k = 0; k < 600 && IT.jogo.estado === 'jogando'; k++, quadros++) IT.jogo.passo(DT);
          var acabou = IT.jogo.estado === 'fim';
          if (!acabou && quadros < limite) return;
          clearInterval(t);
          var linhas = IT.jogo.ranking().map(function (r) {
            var j = r.jogador, e = j.estatisticas;
            var problema = j.tipo === 'cpu' && j.dificuldade !== 'facil' && e.proprioRastro > 0;
            if (problema) falhas++;
            return '    ' + (problema ? '!! ' : '') + j.nome + ' (' + j.tipo + (j.tipo === 'cpu' ? ' ' + j.dificuldade : '') + '): ' +
              Math.floor(r.fracao * 100) + '%  capturas=' + e.capturas + ' cortes=' + e.cortes +
              ' rastroCortado=' + e.rastroCortado + ' pisouNoProprio=' + e.proprioRastro;
          });
          if (c.grupo) {
            var g = resumo[c.grupo] = resumo[c.grupo] || { partidas: 0, vitoriasRobo: 0, cortesNoRobo: 0, cortesDoRobo: 0, pctRobo: 0, pctCpu: 0 };
            var rk = IT.jogo.ranking(), rob = rk.filter(function (r) { return r.jogador.tipo === 'humano'; })[0];
            var cpuR = rk.filter(function (r) { return r.jogador.tipo === 'cpu'; })[0];
            g.partidas++;
            if (rk[0].jogador === rob.jogador) g.vitoriasRobo++;
            g.cortesNoRobo += rob.jogador.estatisticas.rastroCortado;
            g.cortesDoRobo += rob.jogador.estatisticas.cortes;
            g.pctRobo += rob.fracao * 100;
            g.pctCpu += cpuR.fracao * 100;
          }
          if (!acabou) { falhas++; log('FALHA - ' + c.nome + ': a partida não terminou'); }
          else log('ok   - ' + c.nome + ' — ' + Math.round(quadros * DT) + ' s de jogo — ' + w.document.getElementById('fim-titulo').textContent);
          linhas.forEach(log);
          setTimeout(proximo, 50);
        }, 0);
      }

      function terminar() {
        log('');
        log('RESUMO (média por partida de ' + TEMPO + ' s):');
        Object.keys(resumo).forEach(function (nome) {
          var g = resumo[nome], n = g.partidas;
          log('  ' + nome + ': robô venceu ' + g.vitoriasRobo + '/' + n +
            ' | rastro do robô cortado ' + (g.cortesNoRobo / n).toFixed(1) + 'x' +
            ' | robô cortou a CPU ' + (g.cortesDoRobo / n).toFixed(1) + 'x' +
            ' | território robô ' + (g.pctRobo / n).toFixed(0) + '% x CPU ' + (g.pctCpu / n).toFixed(0) + '%');
        });
        window.resumoSimulacao = resumo;
        if (erros.length) { falhas++; log('ERROS NO CONSOLE:\n' + erros.join('\n')); }
        log(falhas ? falhas + ' falha(s)' : 'Todas as simulações passaram.');
        window.resultadoSimulacao = { falhas: falhas, texto: saida.join('\n') };
        document.body.className = falhas ? 'falhou' : 'passou';
        document.title = 'FIM ' + (falhas ? 'FALHOU' : 'OK');
      }

      proximo();
    });
  })();
  </script>
</body>
</html>
