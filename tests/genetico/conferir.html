<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Conferir simulador — Ilhas de Tinta</title>
  <style>body { font-family: monospace; padding: 16px; } iframe { width: 640px; height: 480px; border: 1px solid #ccc; }</style>
</head>
<body>
  <!--
    Confere que o simulador do Node (tests/genetico/simulador.js) dá EXATAMENTE
    o mesmo resultado que o jogo de verdade no navegador: mesmas partidas
    (cenário + semente + robô), mesma "impressão digital" do mapa final.

    Uso: sirva a pasta do projeto (python3 -m http.server) e abra
    http://localhost:8000/tests/genetico/conferir.html
    Compare com:  node tests/genetico/conferir.js
  -->
  <h1>Conferir simulador × navegador</h1>
  <pre id="saida">rodando…</pre>
  <iframe id="jogo" src="../../index.html"></iframe>
  <script src="casos.js"></script>
  <script>window.TRACO = /traco/.test(location.search); if (window.TRACO) CASOS_CONFERIR.length = 1;</script>
  <script>
  (function () {
    'use strict';
    var DT = 1 / 60;
    function mulberry32(semente) {
      var a = semente >>> 0;
      return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hashMapa(grade) {
      var h = 2166136261 >>> 0;
      for (var i = 0; i < grade.total; i++) { h ^= grade.donos[i] * 7 + grade.rastros[i]; h = Math.imul(h, 16777619) >>> 0; }
      return h.toString(16);
    }
    var iframe = document.getElementById('jogo');
    iframe.addEventListener('load', function () {
      var w = iframe.contentWindow, d = iframe.contentDocument;
      var s = d.createElement('script');
      s.src = 'tests/genetico/robo.js';
      s.onload = rodar;
      d.body.appendChild(s);
      function rodar() {
        var IT = w.IlhasDeTinta, jogo = IT.jogo, linhas = [];
        var mathOriginal = w.Math.random;
        window.CASOS_CONFERIR.forEach(function (caso) {
          var vagas = [{ tipo: 'humano', cor: 'rosa', nome: 'Robô', dificuldade: 'medio' }]
            .concat(JSON.parse(JSON.stringify(window.CENARIOS_CONFERIR[caso.cenario])));
          jogo.ultimoTempo = 0;
          jogo.jogar({ vagas: vagas });
          // semente DEPOIS de montar a partida: o desenho (renderer) também sorteia ao montar
          w.Math.random = mulberry32(caso.semente);
          var robo = jogo.jogadores[0];
          if (caso.genes) IT.robo.ligar(robo, jogo, caso.genes); else IT.robo.ligarPerfil(robo, jogo, caso.perfil);
          var max = Math.ceil((IT.config.TEMPO_LIMITE + 2) / DT), n = 0;
          // tudo numa tarefa só: o laço de desenho do jogo não roda no meio
          var traco = [];
          while (jogo.estado === 'jogando' && n < max) { jogo.passo(DT); n++; if (window.TRACO && n <= 400) traco.push(n + ':' + jogo.jogadores.map(function (j) { return j.explorador.x + ',' + j.explorador.y + ',' + j.explorador.direcao; }).join('|')); }
          if (window.TRACO) linhas.push(traco.join('\n'));
          linhas.push(caso.cenario + ' semente ' + caso.semente + ' ' + (caso.perfil || 'genes') + ': ' + hashMapa(jogo.grade) + '  ' + n + ' passos  ' +
            jogo.ranking().map(function (r) { return r.jogador.nome + ' ' + r.celulas; }).join(', '));
          w.Math.random = mathOriginal;
        });
        document.getElementById('saida').textContent = linhas.join('\n');
        document.title = 'PRONTO';
      }
    });
  })();
  </script>
</body>
</html>
